name: Secret scan

# Deliberately no path filter — a secret can leak in any file (a stray
# .tfvars, a pasted key in a script, an accidentally committed .env), so
# this runs on every push/PR regardless of what changed.
on:
  push:
    branches: ["main"]
  pull_request:
    branches: ["main"]

permissions:
  contents: read
  pull-requests: read

jobs:
  secrets-scan:
    name: Secret scan
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      # Dependabot-authored PR runs get a near-zero-permission token regardless
      # of what this workflow requests (a GitHub Actions security restriction,
      # not something we can grant around) — gitleaks-action's PR-commit-listing
      # API call 403s every time. Dependabot only ever changes version pins in
      # requirements.txt, so this step is a low-risk no-op for that one actor.
      # The job itself always runs (and reports a status) so a required-status
      # branch ruleset doesn't wait forever on a check that never fires.
      - uses: gitleaks/gitleaks-action@v2
        if: github.actor != 'dependabot[bot]'
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITLEAKS_ENABLE_COMMENTS: "false"
          GITLEAKS_ENABLE_SUMMARY: "true"
