name: CI - Ansible

on:
  push:
    branches: ["main"]
  pull_request:
    branches: ["main"]

permissions:
  contents: read
  pull-requests: read

jobs:
  changes:
    name: Detect changes
    runs-on: ubuntu-latest
    outputs:
      ansible: ${{ steps.filter.outputs.ansible }}
    steps:
      - uses: actions/checkout@v4
      - uses: dorny/paths-filter@v3
        id: filter
        with:
          filters: |
            ansible:
              - 'ansible/**'
              - '.github/workflows/ci-ansible.yml'

  ansible-lint:
    name: Ansible lint
    needs: changes
    if: needs.changes.outputs.ansible == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install ansible-lint and collections
        run: |
          pip install ansible-core==2.21.* ansible-lint
          ansible-galaxy collection install -r ansible/requirements.yml
      - name: Run ansible-lint
        working-directory: ansible
        run: ansible-lint site.yml roles/
