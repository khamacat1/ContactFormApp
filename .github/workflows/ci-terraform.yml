name: CI - Terraform

on:
  push:
    branches: ["main"]
  pull_request:
    branches: ["main"]

permissions:
  contents: read
  pull-requests: read

jobs:
  changes:
    name: Detect changes
    runs-on: ubuntu-latest
    outputs:
      terraform: ${{ steps.filter.outputs.terraform }}
    steps:
      - uses: actions/checkout@v4
      - uses: dorny/paths-filter@v3
        id: filter
        with:
          filters: |
            terraform:
              - 'terraform/**'
              - '.github/workflows/ci-terraform.yml'

  # Two explicit jobs instead of one matrix job — matrix jobs skipped via a
  # job-level `if:` do not reliably produce their per-matrix-value named
  # check runs (e.g. "Terraform fmt & validate (terraform)"), which left
  # those exact required-check names permanently un-reportable on any PR
  # that doesn't touch terraform/**. Plain jobs with fixed names don't have
  # this ambiguity.
  fmt-validate-main:
    name: Terraform fmt & validate (main)
    needs: changes
    if: needs.changes.outputs.terraform == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: "1.16.2"
      - name: terraform fmt -check
        working-directory: terraform
        run: terraform fmt -check -diff
      - name: terraform init (no backend)
        working-directory: terraform
        run: terraform init -backend=false
      - name: terraform validate
        working-directory: terraform
        run: terraform validate

  fmt-validate-bootstrap:
    name: Terraform fmt & validate (bootstrap)
    needs: changes
    if: needs.changes.outputs.terraform == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: "1.16.2"
      - name: terraform fmt -check
        working-directory: terraform/bootstrap
        run: terraform fmt -check -diff
      - name: terraform init (no backend)
        working-directory: terraform/bootstrap
        run: terraform init -backend=false
      - name: terraform validate
        working-directory: terraform/bootstrap
        run: terraform validate

  tfsec:
    name: tfsec
    needs: changes
    if: needs.changes.outputs.terraform == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Run tfsec
        uses: aquasecurity/tfsec-action@v1.0.3
        with:
          working_directory: terraform
          # Informational for now: several findings are deliberate, already-
          # documented design decisions (e.g. the ALB security group's
          # 0.0.0.0/0 ingress on 80/443, the public-but-IP-restricted EKS
          # API endpoint). Findings are reviewed as part of the Step 9
          # security-hardening pass rather than blocking merges here.
          soft_fail: true
