name: CI - App

on:
  push:
    branches: ["main"]
    paths:
      - "app/**"
      - ".github/workflows/ci-app.yml"
  pull_request:
    branches: ["main"]
    paths:
      - "app/**"
      - ".github/workflows/ci-app.yml"

defaults:
  run:
    working-directory: app

permissions:
  contents: read

jobs:
  lint:
    name: Lint (ruff)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install dev dependencies
        run: pip install -r requirements-dev.txt
      - name: Run ruff
        run: ruff check .

  dependency-audit:
    name: Dependency vulnerability audit
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install runtime dependencies
        run: pip install -r requirements.txt
      - name: Run pip-audit
        run: pip install pip-audit==2.7.3 && pip-audit -r requirements.txt

  docker-build:
    name: Docker build + smoke test
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_DB: contactform
          POSTGRES_USER: contactform
          POSTGRES_PASSWORD: smoketestpassword
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U contactform"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@v4
      - name: Run Docker smoke test
        env:
          SMOKE_DB_PORT: "5432"
          SMOKE_DB_PASSWORD: "smoketestpassword"
        run: bash tests/docker_smoke_test.sh

  test:
    name: Test (pytest)
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_DB: contactform_test
          POSTGRES_USER: contactform
          POSTGRES_PASSWORD: testpassword
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U contactform"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      DB_HOST: localhost
      DB_PORT: 5432
      DB_NAME: contactform_test
      DB_USER: contactform
      DB_PASSWORD: testpassword
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install dev dependencies
        run: pip install -r requirements-dev.txt
      - name: Run pytest
        run: pytest -v --cov=. --cov-report=term-missing
