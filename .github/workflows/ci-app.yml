name: CI - App

on:
  push:
    branches: ["main"]
  pull_request:
    branches: ["main"]

defaults:
  run:
    working-directory: app

permissions:
  contents: read
  pull-requests: read

jobs:
  changes:
    name: Detect changes
    runs-on: ubuntu-latest
    outputs:
      app: ${{ steps.filter.outputs.app }}
    steps:
      - uses: actions/checkout@v4
      - uses: dorny/paths-filter@v3
        id: filter
        with:
          filters: |
            app:
              - 'app/**'
              - '.github/workflows/ci-app.yml'

  lint:
    name: Lint (ruff)
    needs: changes
    if: needs.changes.outputs.app == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install dev dependencies
        run: pip install -r requirements-dev.txt
      - name: Run ruff
        run: ruff check .

  dependency-audit:
    name: Dependency vulnerability audit
    needs: changes
    if: needs.changes.outputs.app == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install runtime dependencies
        run: pip install -r requirements.txt
      - name: Run pip-audit
        run: pip install pip-audit==2.7.3 && pip-audit -r requirements.txt

  docker-build:
    name: Docker build + smoke test
    needs: changes
    if: needs.changes.outputs.app == 'true'
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_DB: contactform
          POSTGRES_USER: contactform
          POSTGRES_PASSWORD: smoketestpassword
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U contactform"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@v4
      - name: Run Docker smoke test
        env:
          SMOKE_DB_PORT: "5432"
          SMOKE_DB_PASSWORD: "smoketestpassword"
        run: bash tests/docker_smoke_test.sh

  test:
    name: Test (pytest)
    needs: changes
    if: needs.changes.outputs.app == 'true'
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_DB: contactform_test
          POSTGRES_USER: contactform
          POSTGRES_PASSWORD: testpassword
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U contactform"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      DB_HOST: localhost
      DB_PORT: 5432
      DB_NAME: contactform_test
      DB_USER: contactform
      DB_PASSWORD: testpassword
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install dev dependencies
        run: pip install -r requirements-dev.txt
      - name: Run pytest
        run: pytest -v --cov=. --cov-report=term-missing
