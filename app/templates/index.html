<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>Contact Form</title>
  <style>
    body { font-family: sans-serif; max-width: 600px; margin: 40px auto; padding: 0 16px; }
    label { display: block; margin-top: 12px; font-weight: bold; }
    input, textarea { width: 100%; padding: 8px; box-sizing: border-box; }
    button { margin-top: 16px; padding: 10px 20px; }
    .error { color: #b00020; }
    .success { color: #1a7f37; }
  </style>
</head>
<body>
  <h1>Contact Us</h1>

  {% if submitted %}
    <p class="success">Thank you — your message has been received.</p>
  {% endif %}

  {% if error %}
    <p class="error">{{ error }}</p>
  {% endif %}

  <form method="POST" action="{{ url_for('submit') }}">
    <label for="name">Name</label>
    <input type="text" id="name" name="name" maxlength="100" required>

    <label for="email">Email</label>
    <input type="email" id="email" name="email" maxlength="254" required>

    <label for="message">Message</label>
    <textarea id="message" name="message" rows="4" maxlength="2000" required></textarea>

    <button type="submit">Submit</button>
  </form>
</body>
</html>
