<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>Contact Form</title>
  <style>
    body { font-family: sans-serif; max-width: 600px; margin: 40px auto; padding: 0 16px; }
    label { display: block; margin-top: 12px; font-weight: bold; }
    input, textarea { width: 100%; padding: 8px; box-sizing: border-box; }
    button { margin-top: 16px; padding: 10px 20px; }
    .error { color: #b00020; }
    table { width: 100%; border-collapse: collapse; margin-top: 32px; }
    th, td { text-align: left; padding: 6px 8px; border-bottom: 1px solid #ddd; font-size: 14px; }
  </style>
</head>
<body>
  <h1>Contact Us</h1>

  {% if error %}
    <p class="error">{{ error }}</p>
  {% endif %}

  <form method="POST" action="{{ url_for('submit') }}">
    <label for="name">Name</label>
    <input type="text" id="name" name="name" maxlength="100" required>

    <label for="email">Email</label>
    <input type="email" id="email" name="email" maxlength="254" required>

    <label for="message">Message</label>
    <textarea id="message" name="message" rows="4" maxlength="2000" required></textarea>

    <button type="submit">Submit</button>
  </form>

  <h2>Recent Submissions</h2>
  <table>
    <tr><th>Name</th><th>Email</th><th>Message</th><th>Submitted</th></tr>
    {% for s in submissions %}
    <tr>
      <td>{{ s[1] }}</td>
      <td>{{ s[2] }}</td>
      <td>{{ s[3] }}</td>
      <td>{{ s[4] }}</td>
    </tr>
    {% endfor %}
  </table>
</body>
</html>
