- name: Create the application namespace (restricted pod security)
  kubernetes.core.k8s:
    state: present
    template: namespace.yml.j2

- name: Create the application service account (linked to its IAM role)
  kubernetes.core.k8s:
    state: present
    template: serviceaccount.yml.j2

- name: Define which Secrets Manager secret the pod receives
  kubernetes.core.k8s:
    state: present
    template: secretproviderclass.yml.j2

- name: Deploy the application
  kubernetes.core.k8s:
    state: present
    template: deployment.yml.j2
    wait: true
    wait_timeout: 300

- name: Expose the application inside the cluster
  kubernetes.core.k8s:
    state: present
    template: service.yml.j2

- name: Create the ALB through an Ingress
  kubernetes.core.k8s:
    state: present
    template: ingress.yml.j2

- name: Wait for the ALB to be provisioned
  kubernetes.core.k8s_info:
    kind: Ingress
    namespace: "{{ app_namespace }}"
    name: contactform
  register: ingress
  until: >-
    ingress.resources | length > 0 and
    ingress.resources[0].status.loadBalancer.ingress is defined
  retries: 30
  delay: 10

- name: Show the application URL
  ansible.builtin.debug:
    msg: "https://{{ ingress.resources[0].status.loadBalancer.ingress[0].hostname }}"